server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect API requests to the backend container
    location /api/ {
        proxy_pass http://dyrtransportes-flask:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static assets directly
    location /assets/ {
        alias /usr/share/nginx/html/static/assets/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # For any other route, serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Additional standard configurations
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff|woff2|ttf|eot)$ {
        # Static file caching
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}