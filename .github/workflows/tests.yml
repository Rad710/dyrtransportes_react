# Type check, lint and run the test suite on every push and pull request.
# The release workflow calls this one, so nothing is published untested.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

# The suite only reads the code, it publishes nothing
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit and component tests
        run: pnpm test:coverage

      - name: Install the browser for the end to end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: End to end tests
        run: pnpm test:e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
